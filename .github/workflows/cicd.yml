name: CI/CD

on:
  push:
    branches:
      - dev
      - prod

env:
  PYTHON_VERSION: "3.11"
  IMAGE_NAME: onnx-mlops-api

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
      AZURE_STORAGE_CONTAINER_NAME: "proyecto-ml"
      MODEL_BLOB_PATH: "models/mnist-12.onnx"
      TEST_INPUT_BLOB_PATH: "data/test_data_set_0/input_0.pb"
      TEST_OUTPUT_BLOB_PATH: "data/test_data_set_0/output_0.pb"
      MAX_TEST_OUTPUT_DIFF: "0.001"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

  build_push_and_deploy_dev:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        run: |
          az acr login --name ${{ secrets.AZURE_CONTAINER_REGISTRY }}

      - name: Build and push images (dev)
        run: |
          ACR_NAME=${{ secrets.AZURE_CONTAINER_REGISTRY }}
          SHA=${{ github.sha }}
          TAG_IMMUTABLE=dev-$SHA
          TAG_FLOATING=dev

          docker build -t $ACR_NAME.azurecr.io/${{ env.IMAGE_NAME }}:$TAG_IMMUTABLE .
          docker push $ACR_NAME.azurecr.io/${{ env.IMAGE_NAME }}:$TAG_IMMUTABLE

          # (Opcional) también mantener tag "dev" apuntando a lo último
          docker tag  $ACR_NAME.azurecr.io/${{ env.IMAGE_NAME }}:$TAG_IMMUTABLE $ACR_NAME.azurecr.io/${{ env.IMAGE_NAME }}:$TAG_FLOATING
          docker push $ACR_NAME.azurecr.io/${{ env.IMAGE_NAME }}:$TAG_FLOATING

      - name: Update Container App to new image (dev)
        run: |
          ACR_NAME=${{ secrets.AZURE_CONTAINER_REGISTRY }}
          RG=${{ secrets.AZURE_RESOURCE_GROUP }}
          APP_NAME=${{ secrets.AZURE_CONTAINERAPP_NAME_DEV }}
          SHA=${{ github.sha }}
          TAG_IMMUTABLE=dev-$SHA

          az containerapp update \
            --name "$APP_NAME" \
            --resource-group "$RG" \
            --image "$ACR_NAME.azurecr.io/${{ env.IMAGE_NAME }}:$TAG_IMMUTABLE"

  build_push_and_deploy_prod:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/prod'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        run: |
          az acr login --name ${{ secrets.AZURE_CONTAINER_REGISTRY }}

      - name: Build and push images (prod)
        run: |
          ACR_NAME=${{ secrets.AZURE_CONTAINER_REGISTRY }}
          SHA=${{ github.sha }}
          TAG_IMMUTABLE=prod-$SHA
          TAG_FLOATING=prod

          docker build -t $ACR_NAME.azurecr.io/${{ env.IMAGE_NAME }}:$TAG_IMMUTABLE .
          docker push $ACR_NAME.azurecr.io/${{ env.IMAGE_NAME }}:$TAG_IMMUTABLE

          # (Opcional) también mantener tag "prod" apuntando a lo último
          docker tag  $ACR_NAME.azurecr.io/${{ env.IMAGE_NAME }}:$TAG_IMMUTABLE $ACR_NAME.azurecr.io/${{ env.IMAGE_NAME }}:$TAG_FLOATING
          docker push $ACR_NAME.azurecr.io/${{ env.IMAGE_NAME }}:$TAG_FLOATING

      - name: Update Container App to new image (prod)
        run: |
          ACR_NAME=${{ secrets.AZURE_CONTAINER_REGISTRY }}
          RG=${{ secrets.AZURE_RESOURCE_GROUP }}
          APP_NAME=${{ secrets.AZURE_CONTAINERAPP_NAME_PROD }}
          SHA=${{ github.sha }}
          TAG_IMMUTABLE=prod-$SHA

          az containerapp update \
            --name "$APP_NAME" \
            --resource-group "$RG" \
            --image "$ACR_NAME.azurecr.io/${{ env.IMAGE_NAME }}:$TAG_IMMUTABLE"
