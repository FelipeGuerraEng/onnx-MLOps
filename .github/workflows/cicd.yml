name: CI/CD

on:
  push:
    branches:
      - dev
      - prod

env:
  PYTHON_VERSION: "3.11"

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
      AZURE_STORAGE_CONTAINER_NAME: "proyecto-ml"
      MODEL_BLOB_PATH: "models/mnist-12.onnx"
      TEST_INPUT_BLOB_PATH: "data/test_data_set_0/input_0.pb"
      TEST_OUTPUT_BLOB_PATH: "data/test_data_set_0/output_0.pb"
      MAX_TEST_OUTPUT_DIFF: "0.001"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

  build_and_deploy_dev:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and deploy to Azure Container Apps (dev)
        uses: azure/container-apps-deploy-action@v1
        with:
          appSourcePath: ${{ github.workspace }}
          acrName: ${{ secrets.AZURE_CONTAINER_REGISTRY }}
          containerAppName: ${{ secrets.AZURE_CONTAINERAPP_NAME_DEV }}
          resourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP }}
          ingress: external
          targetPort: 8000
          environmentVariables: |
            ENVIRONMENT=dev
            AZURE_STORAGE_CONNECTION_STRING=${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
            AZURE_STORAGE_CONTAINER_NAME=proyecto-ml
            MODEL_BLOB_PATH=models/mnist-12.onnx
            TEST_INPUT_BLOB_PATH=data/test_data_set_0/input_0.pb
            TEST_OUTPUT_BLOB_PATH=data/test_data_set_0/output_0.pb
            MAX_TEST_OUTPUT_DIFF=0.001

  build_and_deploy_prod:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/prod'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and deploy to Azure Container Apps (prod)
        uses: azure/container-apps-deploy-action@v1
        with:
          appSourcePath: ${{ github.workspace }}
          acrName: ${{ secrets.AZURE_CONTAINER_REGISTRY }}
          containerAppName: ${{ secrets.AZURE_CONTAINERAPP_NAME_PROD }}
          resourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP }}
          ingress: external
          targetPort: 8000
          environmentVariables: |
            ENVIRONMENT=prod
            AZURE_STORAGE_CONNECTION_STRING=${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
            AZURE_STORAGE_CONTAINER_NAME=proyecto-ml
            MODEL_BLOB_PATH=models/mnist-12.onnx
            TEST_INPUT_BLOB_PATH=data/test_data_set_0/input_0.pb
            TEST_OUTPUT_BLOB_PATH=data/test_data_set_0/output_0.pb
            MAX_TEST_OUTPUT_DIFF=0.001
